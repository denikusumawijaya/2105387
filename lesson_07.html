<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH TUTORING by Deni - Multiples of 10, 11, 12</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --bg: #131f24;
            --card-bg: #1e2d3d;
            --text-main: #ffffff;
            --text-sub: #b8b8b8;
            --border: #37464f;
            --error: #ff4b4b;
            --warning: #ffc800;
            --node-locked: #6b6b6b;
            --node-current: #58cc02;
            --node-completed: #58cc02;
        }
        body {
            font-family: 'Nunito', sans-serif; /* Duolingo style font approximation */
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Top Navigation Bar */
        .top-bar {
            background-color: var(--card-bg);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            z-index: 100;
        }
        .brand { font-weight: 800; font-size: 1.2rem; color: var(--primary); }
        .reset-all-btn {
            background: var(--error); color: white; border: none; padding: 8px 15px;
            border-radius: 12px; cursor: pointer; font-weight: 700; border-bottom: 4px solid #cc0000;
            transition: all 0.1s;
        }
        .reset-all-btn:active { border-bottom-width: 2px; transform: translateY(2px); }

        /* Duolingo Path Container */
        .path-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }
        .node-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s forwards;
        }
        .node-circle {
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 4px solid #4a4a4a;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: white;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            z-index: 2;
        }
		
        .node-circle.available i { color: #131f24; }
        .node-circle.completed i { color: white; }
		
        .node-circle.available {
            background-color: var(--warning); /* Warna Kuning/Gold seperti Duolingo */
            border: 4px solid #e6b000;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #cc9e00; /* Efek 3D tombol Duolingo */
        }
        .node-circle.available:hover { 
            filter: brightness(1.1); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 0 #cc9e00; 
        }
        .node-circle.available:active { 
            transform: translateY(2px); 
            box-shadow: 0 2px 0 #cc9e00; 
        }

        .node-circle.completed {
            background-color: var(--node-completed); /* Warna Hijau */
            border: 4px solid var(--primary-dark);
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark);
        }
        .node-circle.completed:hover { 
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--primary-dark);
        }
        .node-circle.completed:active { 
            transform: translateY(2px); 
            box-shadow: 0 2px 0 var(--primary-dark); 
        }
        
        .node-line {
            width: 6px; height: 40px; background-color: #4a4a4a; z-index: 1; border-radius: 3px;
        }
        .node-line.completed { background-color: var(--primary); }

        .node-title {
            margin-top: 10px;
            font-weight: 700;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
        }
        .node-circle.available + .node-title, .node-circle.completed + .node-title { color: var(--text-main); }

        /* Lesson Content Area */
        .lesson-area {
            display: none;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg);
        }
        .lesson-area.active { display: flex; }

        .lesson-header {
            background: var(--card-bg); padding: 15px; border-bottom: 2px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .back-btn {
            background: transparent; border: 2px solid var(--border); color: var(--text-main);
            padding: 8px 15px; border-radius: 12px; cursor: pointer; font-weight: 700;
        }
        .progress-bar-container { flex: 1; margin: 0 20px; background: #37464f; height: 10px; border-radius: 5px; }
        .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 5px; width: 0%; transition: width 0.3s; }

        .lesson-content {
            flex: 1; overflow-y: auto; padding: 30px 20px; display: flex; flex-direction: column; align-items: center;
        }
        .content-box {
            background: var(--card-bg); border: 2px solid var(--border); border-radius: 16px;
            padding: 20px; width: 100%; max-width: 600px; margin-bottom: 20px;
            box-shadow: 0 4px 0 var(--border);
        }
        .bilingual { margin-bottom: 15px; }
        .indo { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 5px; }
        .eng { font-size: 0.9rem; font-weight: 600; color: var(--text-sub); font-style: italic; }

        /* KaTeX overrides for dark theme */
        .katex { color: var(--text-main); font-size: 1.2em; }
        .math-display { margin: 15px 0; text-align: center; overflow-x: auto; }

        /* Exercise Styles */
        .exercise-box { border-color: var(--warning); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .option-btn {
            background: var(--card-bg); border: 2px solid var(--border); color: var(--text-main);
            padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; min-height: 50px;
            transition: all 0.1s; position: relative;
        }
        .option-btn:active { transform: translateY(2px); }
        .option-btn.selected { border-color: var(--warning); color: var(--warning); background: #3a3a00; }
        .option-btn.correct { border-color: var(--primary); color: var(--primary); background: #1a3a00; border-bottom-width: 4px; }
        .option-btn.wrong { border-color: var(--error); color: var(--error); background: #3a0000; border-bottom-width: 4px; }

        .input-answer {
            background: #2b3b4b; border: 2px solid var(--border); border-radius: 12px;
            color: var(--text-main); padding: 12px; font-size: 1.2rem; width: 100%;
            text-align: center; font-weight: 700;
        }
        .input-answer:focus { outline: none; border-color: var(--warning); }

        /* Explanation Collapse */
        .explanation-collapse { margin-top: 15px; background: #253545; border-radius: 12px; overflow: hidden; max-height: 0; transition: max-height 0.3s ease-out; }
        .explanation-collapse.open { max-height: 500px; border: 1px solid var(--border); padding: 15px; }
        .explanation-title { font-weight: 700; color: var(--primary); margin-bottom: 5px; }
        .explanation-text { color: var(--text-sub); font-size: 0.95rem; }

        /* Bottom Navigation in Lesson */
        .lesson-footer {
            background: var(--card-bg); padding: 15px 20px; border-top: 2px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav-btn {
            padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; color: white;
        }
        .nav-btn.prev { background: #37464f; border-bottom: 4px solid #253545; }
        .nav-btn.next { background: var(--primary); border-bottom: 4px solid var(--primary-dark); }
		.nav-btn.check { background: var(--warning); border-bottom: 4px solid #e6b000; color: #131f24; font-weight: 800; }
        .nav-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .nav-btn.reset-current { background: var(--error); border-bottom: 4px solid #cc0000; }

        /* SVG Illustration styles */
        .svg-illo { width: 100%; max-width: 200px; margin: 10px auto; display: block; }

        /* Animations */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.3s; }

        /* Print CSS - STRICT A4 FORMAT */
        @media print {
            body { background: white; color: black; height: auto; overflow: visible; }
            .top-bar, .lesson-footer, .path-container, .nav-btn, .option-btn, .explanation-collapse, .lesson-area { display: none !important; }
            .print-area {
                display: block !important; width: 100%; margin: 0; padding: 10mm; font-size: 11pt; color: black;
                font-family: Arial, sans-serif;
            }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            .print-table th, .print-table td { border: 1px solid black; padding: 4px; text-align: left; font-size: 10pt; }
            .print-table th { background-color: #eee; }
            .print-signature { margin-top: 30px; text-align: right; }
        }
        .print-area { display: none; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="brand"><i class="fas fa-calculator"></i> MATH TUTORING by Deni</div>
        <button class="reset-all-btn" onclick="resetAllProgress()"><i class="fas fa-trash-alt"></i> Reset All</button>
    </div>

    <!-- PATH CONTAINER (Duolingo Style) -->
    <div class="path-container" id="pathContainer">
        <!-- Nodes will be injected via JS -->
    </div>

    <!-- LESSON AREA (Hidden by default) -->
    <div class="lesson-area" id="lessonArea">
        <div class="lesson-header">
            <button class="back-btn" onclick="showPath()"><i class="fas fa-arrow-left"></i> Kembali</button>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <span id="progressText" style="font-weight:700; color:var(--text-sub)">0/0</span>
        </div>

        <div class="lesson-content" id="lessonContent">
            <!-- Content injected via JS -->
        </div>

        <div class="lesson-footer">
            <button class="nav-btn prev" id="btnPrev" onclick="prevStep()"><i class="fas fa-chevron-left"></i> Kembali</button>
            
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="nav-btn check" id="btnCheck" onclick="checkAnswer()" style="display:none"><i class="fas fa-check-circle"></i> Periksa</button>
                <button class="nav-btn reset-current" id="btnResetCurrent" onclick="resetCurrentExercise()" style="display:none"><i class="fas fa-redo"></i> Coba Lagi</button>
            </div>

            <button class="nav-btn next" id="btnNext" onclick="nextStep()">Lanjut <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <!-- PRINT AREA (Hidden, used only for printing) -->
    <div class="print-area" id="printArea">
        <h2 style="text-align: center; margin-bottom: 0;">MATH TUTORING by Deni</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px;">
            <div><strong>Name:</strong> ________________________</div>
            <div><strong>Date:</strong> ________________________</div>
            <div><strong>Topic:</strong> Tabel Perkalian 10, 11, 12 dan Kelipatannya</div>
            <div><strong>Assignment Group:</strong> <span id="printGroup"></span></div>
            <div><strong>Score:</strong> <span id="printScore"></span> / 10</div>
        </div>
        <table class="print-table">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Question</th>
                    <th>Student Answer</th>
                    <th>Correct Answer</th>
                    <th>Note (✅/❌)</th>
                </tr>
            </thead>
            <tbody id="printTableBody"></tbody>
        </table>
        <div class="print-signature">
            <p>Checked by,</p>
            <br><br>
            <p><strong>Deni</strong></p>
        </div>
    </div>

    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
        // --- STATE MANAGEMENT ---
        let appState = {
            currentSectionIndex: 0,
            currentStepIndex: 0,
            progress: [] // Array of objects: { completed: bool }
        };

        // --- COURSE DATA STRUCTURE ---
        const courseData = [
            {
                id: "home",
                title: "Home & Rules",
                icon: "fa-home",
                type: "info",
                steps: [
                    { type: "theory", content: `
                        <div class="bilingual"><p class="indo">Selamat datang di sesi bimbingan belajar!</p><p class="eng">Welcome to the tutoring session!</p></div>
                        <div class="bilingual"><p class="indo">Topik hari ini: <strong>Tabel Perkalian 10, 11, 12 dan Kelipatannya</strong></p><p class="eng">Today's topic: <strong>Multiplication Table of 10, 11, 12 and Their Multiples</strong></p></div>
                        <svg class="svg-illo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#58cc02"/><text x="50" y="55" font-family="Arial" font-size="20" fill="white" text-anchor="middle">10,11,12</text></svg>
                        <div class="bilingual"><p class="indo">Peraturan kelas:</p><p class="eng">Class rules:</p></div>
                        <ul>
                            <li class="bilingual"><p class="indo">1. Berbicara secara bergantian.</p><p class="eng">1. Take turns speaking.</p></li>
                            <li class="bilingual"><p class="indo">2. Meminta izin jika ingin meninggalkan kelas.</p><p class="eng">2. Ask permission if you want to leave the class.</p></li>
                            <li class="bilingual"><p class="indo">3. Menyalakan kamera dan microphone jika diperlukan.</p><p class="eng">3. Turn on camera and microphone if needed.</p></li>
                        </ul>
                    `}
                ]
            },
            {
                id: "sec1",
                title: "Spiral Review Warm-up (00:00-00:10)",
                icon: "fa-fire",
                type: "section",
                steps: [
                    // THEORY 1
                    { type: "theory", content: `
                        <div class="bilingual"><p class="indo">Sebelum kita masuk ke misi baru, mari kita asah otak dengan tantangan kilat dari petualangan sebelumnya!</p><p class="eng">Before we enter a new mission, let's sharpen our brains with a quick challenge from the previous adventure!</p></div>
                        <svg class="svg-illo" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="10" fill="#ffc800"/><text x="50" y="55" font-family="Arial" font-size="14" fill="#131f24" text-anchor="middle">Rakit & Bongkar</text></svg>
                        <div class="bilingual"><p class="indo">Merakit Bilangan: Rakitlah bilangan ini: 4 ribuan, 0 ratusan, 7 puluhan, dan 2 satuan.</p><p class="eng">Assembling Numbers: Assemble this number: 4 thousands, 0 hundreds, 7 tens, and 2 units.</p></div>
                        <div class="math-display">\\( 4000 + 0 + 70 + 2 = 4072 \\)</div>
                    `},
                    // EXERCISE 1-3 (Merakit & Bongkar)
                    { type: "exercise", question: "<p class='indo'>Rakitlah bilangan: 3 ribuan + 5 ratusan + 2 satuan = ...</p><p class='eng'>Assemble the number: 3 thousands + 5 hundreds + 2 units = ...</p>", options: ["3502", "3520", "3025", "3052"], answer: "3502", explanation: "<p class='indo'>3 ribuan (3000) + 5 ratusan (500) + 0 puluhan (0) + 2 satuan (2) = 3502.</p><p class='eng'>3 thousands (3000) + 5 hundreds (500) + 0 tens (0) + 2 units (2) = 3502.</p>" },
                    { type: "exercise", question: "<p class='indo'>Bongkar bilangan 8.530 menjadi ribuan, ratusan, dan puluhan!</p><p class='eng'>Break down the number 8,530 into thousands, hundreds, and tens!</p>", options: ["8000 + 500 + 30", "8000 + 50 + 30", "800 + 500 + 30", "8000 + 500 + 3"], answer: "8000 + 500 + 30", explanation: "<p class='indo'>8.530 terdiri dari 8 ribuan (8000), 5 ratusan (500), dan 3 puluhan (30).</p><p class='eng'>8,530 consists of 8 thousands (8000), 5 hundreds (500), and 3 tens (30).</p>" },
                    { type: "exercise", question: "<p class='indo'>Di awan bilangan, mana yang lebih besar: 3.409 atau 3.490?</p><p class='eng'>In the number cloud, which is larger: 3,409 or 3,490?</p>", options: ["3.409", "3.490", "Sama besar", "Tidak bisa ditentukan"], answer: "3.490", explanation: "<p class='indo'>Bandikan puluhannya: 90 lebih besar dari 09, jadi 3.490 lebih besar.</p><p class='eng'>Compare the tens: 90 is larger than 09, so 3,490 is larger.</p>" },
                    // THEORY 2
                    { type: "theory", content: `
                        <div class="bilingual"><p class="indo">Membongkar bilangan sangat membantu kita memahami nilai tempat setiap angka.</p><p class="eng">Breaking down numbers really helps us understand the place value of each digit.</p></div>
                        <div class="bilingual"><p class="indo">Contoh lainnya, bongkar 7.890!</p><p class='eng'>Another example, break down 7,890!</p></div>
                        <div class="math-display">\\( 7890 = 7000 + 800 + 90 + 0 \\)</div>
                        <div class="bilingual"><p class="indo">Urutkan dari terkecil: 1.200, 1.020, 2.100.</p><p class="eng">Sort from smallest: 1,200, 1,020, 2,100.</p></div>
                        <div class="math-display">\\( 1020 < 1200 < 2100 \\)</div>
                    `},
                    // EXERCISE 4-6 (Diagnostik Awan)
                    { type: "exercise", question: "<p class='indo'>Urutkan bilangan ini dari terkecil ke terbesar: 4.500, 5.400, 4.050.</p><p class='eng'>Sort these numbers from smallest to largest: 4,500, 5,400, 4,050.</p>", options: ["4.050, 4.500, 5.400", "4.500, 4.050, 5.400", "5.400, 4.500, 4.050", "4.500, 5.400, 4.050"], answer: "4.050, 4.500, 5.400", explanation: "<p class='indo'>Ratusan 0 lebih kecil dari 5, jadi 4.050 < 4.500. Lalu 4 ribuan lebih kecil dari 5 ribuan.</p><p class='eng'>Hundreds 0 is smaller than 5, so 4,050 < 4,500. Then 4 thousands is smaller than 5 thousands.</p>" },
                    { type: "exercise", question: "<p class='indo'>Rakitlah bilangan: 6 ribuan + 8 ratusan + 0 puluhan + 9 satuan = ...</p><p class='eng'>Assemble the number: 6 thousands + 8 hundreds + 0 tens + 9 units = ...</p>", options: ["6809", "6890", "6089", "6908"], answer: "6809", explanation: "<p class='indo'>6000 + 800 + 0 + 9 = 6809.</p><p class='eng'>6000 + 800 + 0 + 9 = 6809.</p>" },
                    { type: "exercise", question: "<p class='indo'>Berapakah nilai tempat ratusan pada bilangan 3.542?</p><p class='eng'>What is the place value of hundreds in the number 3,542?</p>", options: ["500", "50", "5", "400"], answer: "500", explanation: "<p class='indo'>Angka 5 ada di posisi ratusan, jadi nilainya 500.</p><p class='eng'>The digit 5 is in the hundreds position, so its value is 500.</p>" },
                    // THEORY 3
                    { type: "theory", content: `
                        <div class="bilingual"><p class="indo">Diagnostik Cepat! Jika kita punya uang, menghitungnya menggunakan kelipatan sangat penting.</p><p class="eng">Quick Diagnostic! If we have money, counting it using multiples is very important.</p></div>
                        <svg class="svg-illo" viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" rx="5" fill="#58cc02"/><text x="50" y="55" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Rp 1000</text></svg>
                        <div class="bilingual"><p class="indo">Jika aku punya 5 lembar uang 1.000, berapa total nilainya?</p><p class="eng">If I have 5 pieces of 1,000 money, what is the total value?</p></div>
                        <div class="math-display">\\( 5 \\times 1000 = 5000 \\)</div>
                    `},
                    // EXERCISE 7-10 (Uang & Diagnostik Cepat)
                    { type: "exercise", question: "<p class='indo'>Jika kamu punya 8 lembar uang Rp1.000, berapa total nilainya?</p><p class='eng'>If you have 8 pieces of Rp1,000 money, what is the total value?</p>", options: ["8.000", "800", "80.000", "1.008"], answer: "8.000", explanation: "<p class='indo'>8 x 1.000 = 8.000.</p><p class='eng'>8 x 1,000 = 8,000.</p>" },
                    { type: "exercise", question: "<p class='indo'>Toko punya 3 kotak isi 10 telur. Berapa total telur?</p><p class='eng'>The store has 3 boxes containing 10 eggs. How many total eggs?</p>", options: ["30", "13", "300", "10"], answer: "30", explanation: "<p class='indo'>3 x 10 = 30 telur.</p><p class='eng'>3 x 10 = 30 eggs.</p>" },
                    { type: "exercise", question: "<p class='indo'>Mana yang lebih besar: 2.300 atau 3.200?</p><p class='eng'>Which is larger: 2,300 or 3,200?</p>", input: true, answer: "3.200", explanation: "<p class='indo'>3 ribuan lebih besar dari 2 ribuan.</p><p class='eng'>3 thousands is larger than 2 thousands.</p>" },
                    { type: "exercise", question: "<p class='indo'>Bongkar bilangan 9.009!</p><p class='eng'>Break down the number 9,009!</p>", options: ["9000 + 9", "900 + 9", "9000 + 90", "9 + 9"], answer: "9000 + 9", explanation: "<p class='indo'>9 ribuan (9000) + 0 ratusan + 0 puluhan + 9 satuan (9).</p><p class='eng'>9 thousands (9000) + 0 hundreds + 0 tens + 9 units (9).</p>" }
                ]
            },

            // --- SECTION 2: INTRODUCTION & REAL-WORLD CONNECTION ---
            {
                id: "sec2",
                title: "Introduction & Real-World Connection (00:10-00:15)",
                icon: "fa-globe",
                type: "section",
                steps: [
                    // THEORY 1
                    { type: "theory", content: `
                        <div class="bilingual"><p class="indo">Hebat! Kamu masih ingat semuanya. Hari ini kita akan menjadi <strong>detektif pola</strong>.</p><p class="eng">Great! You still remember everything. Today we will become <strong>pattern detectives</strong>.</p></div>
                        <svg class="svg-illo" viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#ffc800"/><rect x="30" y="65" width="40" height="20" rx="5" fill="#58cc02"/><text x="50" y="80" font-family="Arial" font-size="10" fill="white" text-anchor="middle">PATTERN</text></svg>
                        <div class="bilingual"><p class="indo">Pernahkah kamu melihat jam atau menghitung telur dalam kotak? Biasanya mereka berkelompok 12 (lusin) atau 10 (puluhan).</p><p class="eng">Have you ever seen a clock or counted eggs in a carton? Usually they are grouped in 12s (dozens) or 10s (tens).</p></div>
                    `},

        // --- CORE FUNCTIONS ---
        
        // Initialize App (Protected)
        function initApp() {
            let savedProgress = null;
            try {
                savedProgress = localStorage.getItem('mathTutorProgress');
            } catch (e) {
                console.warn("localStorage diblokir. Memulai sesi baru tanpa data lama.");
            }

            if (savedProgress) {
                appState.progress = JSON.parse(savedProgress);
                // Migration: ensure old progress format gets studentAnswer properties
                appState.progress.forEach(p => {
                    if(p.studentAnswer === undefined) p.studentAnswer = "";
                    if(p.correct === undefined) p.correct = false;
                });
            } else {
                // Build fresh progress array with detailed tracking
                let totalSteps = 0;
                courseData.forEach(sec => { totalSteps += sec.steps.length; });
                for(let i=0; i<totalSteps; i++) { appState.progress.push({ completed: false, correct: false, studentAnswer: "" }); }
            }
            renderPath();
        }

        // Save Progress (Protected)
        function saveProgress() {
            try {
                localStorage.setItem('mathTutorProgress', JSON.stringify(appState.progress));
            } catch (e) {
                console.warn("localStorage diblokir oleh browser (file:// mode). Progress tidak akan tersimpan saat refresh.");
            }
        }

        // Reset All (Protected)
        function resetAllProgress() {
            if(confirm('Apakah kamu yakin ingin menghapus semua progres? / Are you sure you want to delete all progress?')) {
                try {
                    localStorage.removeItem('mathTutorProgress');
                } catch (e) {
                    console.warn("localStorage diblokir, data tidak bisa dihapus dari storage.");
                }
                // Selalu reset array state walau localStorage gagal
                let totalSteps = 0;
                courseData.forEach(sec => { totalSteps += sec.steps.length; });
                appState.progress = [];
                for(let i=0; i<totalSteps; i++) { appState.progress.push({ completed: false, correct: false, studentAnswer: "" }); }
                
                initApp();
                showPath();
            }
        }

        // Render Duolingo Path
        function renderPath() {
            const container = document.getElementById('pathContainer');
            container.innerHTML = '';
            let stepCounter = 0;

            courseData.forEach((sec, secIndex) => {
                // Add Line (if not first)
                if(secIndex !== 0) {
                    let line = document.createElement('div');
                    line.className = 'node-line';
                    // Garis berubah hijau jika node sebelumnya sudah selesai
                    if(appState.progress[stepCounter-1].completed) line.classList.add('completed');
                    container.appendChild(line);
                }

                // Add Node Circle
                let wrapper = document.createElement('div');
                wrapper.className = 'node-wrapper';
                
                let circle = document.createElement('div');
                circle.className = 'node-circle';
                
                // Determine node state (available or completed)
                let isCompleted = true;
                for(let i=0; i<sec.steps.length; i++) {
                    if(!appState.progress[stepCounter+i].completed) isCompleted = false;
                }

                if(isCompleted) {
                    // NODE HIJAU (Sudah selesai)
                    circle.classList.add('completed');
                    circle.innerHTML = `<i class="fas fa-star"></i>`; // Ganti icon dengan bintang
                    circle.onclick = () => startLesson(secIndex);
                } else {
                    // NODE KUNING (Belum selesai, tapi bisa diakses)
                    circle.classList.add('available');
                    circle.innerHTML = `<i class="fas ${sec.icon}"></i>`; // Pakai icon section asli
                    circle.onclick = () => startLesson(secIndex);
                }

                let title = document.createElement('div');
                title.className = 'node-title';
                title.innerText = sec.title;

                wrapper.appendChild(circle);
                wrapper.appendChild(title);
                container.appendChild(wrapper);

                stepCounter += sec.steps.length;
            });
        }

        // Start Lesson / Show Lesson Area
        function startLesson(secIndex) {
            appState.currentSectionIndex = secIndex;
            appState.currentStepIndex = 0;
            
            // Find first uncompleted step in this section
            let globalStart = getGlobalIndex(secIndex, 0);
            for(let i=0; i<courseData[secIndex].steps.length; i++) {
                if(!appState.progress[globalStart + i].completed) {
                    appState.currentStepIndex = i;
                    break;
                }
            }

            document.getElementById('pathContainer').style.display = 'none';
            document.getElementById('lessonArea').classList.add('active');
            renderStep();
        }

        // Show Path (Back button) - Core definition
        function showPath() {
            document.getElementById('lessonArea').classList.remove('active');
            document.getElementById('pathContainer').style.display = 'flex';
            renderPath();
        }

        // Get Global Index from Section and Step
        function getGlobalIndex(secIdx, stepIdx) {
            let count = 0;
            for(let s=0; s<secIdx; s++) { count += courseData[s].steps.length; }
            return count + stepIdx;
        }

        // Render Current Step Content
        function renderStep() {
            const sec = courseData[appState.currentSectionIndex];
            const step = sec.steps[appState.currentStepIndex];
            const globalIdx = getGlobalIndex(appState.currentSectionIndex, appState.currentStepIndex);
            const isCompleted = appState.progress[globalIdx].completed;

            // Update Progress Bar
            let completedInSec = 0;
            for(let i=0; i<sec.steps.length; i++) {
                if(appState.progress[getGlobalIndex(appState.currentSectionIndex, i)].completed) completedInSec++;
            }
            document.getElementById('progressBar').style.width = `${(completedInSec / sec.steps.length) * 100}%`;
            document.getElementById('progressText').innerText = `${completedInSec}/${sec.steps.length}`;

            // Render Content
            const contentArea = document.getElementById('lessonContent');
            contentArea.innerHTML = '';

            if(step.type === 'theory') {
                contentArea.innerHTML = `<div class="content-box animated fadeInUp">${step.content}</div>`;
                // Nav visibility for Theory
                document.getElementById('btnCheck').style.display = 'none';
                document.getElementById('btnResetCurrent').style.display = 'none';
            } else if(step.type === 'exercise') {
                let exHTML = `<div class="content-box exercise-box animated fadeInUp">
                    <div class="bilingual"><p class="indo" style="color:var(--warning)"><i class="fas fa-question-circle"></i> Latihan</p><p class="eng">Exercise</p></div>
                    ${step.question}`;
                
                if(step.options) {
                    exHTML += `<div class="options-grid" id="optGrid">`;
                    step.options.forEach(opt => {
                        exHTML += `<button class="option-btn" onclick="selectOption(this, '${opt}')">${opt}</button>`;
                    });
                    exHTML += `</div>`;
                } else if(step.input) {
                    exHTML += `<input type="text" class="input-answer" id="inputField" placeholder="Ketik jawaban... / Type answer...">`;
                }

                exHTML += `<div class="explanation-collapse" id="exCollapse">
                    <div class="explanation-title"><i class="fas fa-lightbulb"></i> Penjelasan / Explanation</div>
                    <div class="explanation-text">${step.explanation}</div>
                </div></div>`;
                
                contentArea.innerHTML = exHTML;
                
                // Nav visibility for Exercise
                document.getElementById('btnCheck').style.display = isCompleted ? 'none' : 'inline-block';
                document.getElementById('btnResetCurrent').style.display = 'inline-block';
                
                if(isCompleted) {
                    autoShowExplanation();
                }
            }

            // NAVIGASI SELALU AKTIF
            document.getElementById('btnPrev').disabled = (appState.currentStepIndex === 0);
            document.getElementById('btnNext').disabled = false; // Selalu bisa lanjut

            // Re-render Math
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "\\(", right: "\\)", display: false},
                    {left: "\\[", right: "\\]", display: true}
                ]
            });
        }

        // Exercise Logic
        function selectOption(btn, val) {
            if(appState.progress[getGlobalIndex(appState.currentSectionIndex, appState.currentStepIndex)].completed) return;
            const grid = document.getElementById('optGrid');
            Array.from(grid.children).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('btnNext').disabled = false;
        }

        // Exercise Logic
        function checkAnswer() {
            const step = courseData[appState.currentSectionIndex].steps[appState.currentStepIndex];
            const globalIdx = getGlobalIndex(appState.currentSectionIndex, appState.currentStepIndex);
            let userAnswer = '';

            // Validasi: Harus isi jawaban sebelum periksa
            if(step.options) {
                const selected = document.querySelector('.option-btn.selected');
                if(!selected) {
                    alert("Pilih jawaban terlebih dahulu! / Select an answer first!");
                    return;
                }
                userAnswer = selected.innerText;
            } else if(step.input) {
                userAnswer = document.getElementById('inputField').value.trim();
                if(!userAnswer) {
                    alert("Ketik jawaban terlebih dahulu! / Type an answer first!");
                    return;
                }
            }

            const isCorrect = (userAnswer === step.answer);
            
            // Update state
            appState.progress[globalIdx].completed = true;
            appState.progress[globalIdx].correct = isCorrect;
            appState.progress[globalIdx].studentAnswer = userAnswer;
            saveProgress();

            // Update UI Jawaban
            if(isCorrect) {
                if(step.options) {
                    document.querySelector('.option-btn.selected').classList.add('correct');
                    document.querySelector('.option-btn.selected').classList.remove('selected');
                } 
                if(step.input) document.getElementById('inputField').style.borderColor = "var(--primary)";
                showExplanation(true);
            } else {
                if(step.options) {
                    document.querySelector('.option-btn.selected').classList.add('wrong');
                    document.querySelector('.option-btn.selected').classList.remove('selected');
                    Array.from(document.getElementById('optGrid').children).forEach(b => {
                        if(b.innerText === step.answer) b.classList.add('correct');
                    });
                }
                if(step.input) {
                    document.getElementById('inputField').style.borderColor = "var(--error)";
                    document.getElementById('inputField').classList.add('shake');
                }
                showExplanation(false);
            }

            // Sembunyikan tombol Periksa setelah selesai memeriksa
            document.getElementById('btnCheck').style.display = 'none';
        }

        function showExplanation(isCorrect) {
            const collapse = document.getElementById('exCollapse');
            if(!isCorrect) collapse.style.borderLeft = "4px solid var(--error)";
            collapse.classList.add('open');
        }

        function autoShowExplanation() {
            const step = courseData[appState.currentSectionIndex].steps[appState.currentStepIndex];
            const globalIdx = getGlobalIndex(appState.currentSectionIndex, appState.currentStepIndex);
            const state = appState.progress[globalIdx];
            
            if(step.options) {
                Array.from(document.getElementById('optGrid').children).forEach(b => {
                    if(b.innerText === step.answer) b.classList.add('correct');
                });
                // Show what user selected if it was wrong
                if(state.studentAnswer && !state.correct) {
                    Array.from(document.getElementById('optGrid').children).forEach(b => {
                        if(b.innerText === state.studentAnswer) b.classList.add('wrong');
                    });
                }
            }
            if(step.input) {
                document.getElementById('inputField').value = state.studentAnswer || step.answer;
                document.getElementById('inputField').style.borderColor = state.correct ? "var(--primary)" : "var(--error)";
            }
            document.getElementById('exCollapse').classList.add('open');
        }

        // Navigation Logic
        function nextStep() {
            appState.currentStepIndex++;
            if(appState.currentStepIndex >= courseData[appState.currentSectionIndex].steps.length) {
                showPath();
            } else {
                renderStep();
            }
        }
        function prevStep() {
            if(appState.currentStepIndex > 0) {
                appState.currentStepIndex--;
                renderStep();
            }
        }

        function resetCurrentExercise() {
            const globalIdx = getGlobalIndex(appState.currentSectionIndex, appState.currentStepIndex);
            appState.progress[globalIdx] = { completed: false, correct: false, studentAnswer: "" };
            saveProgress();
            renderStep();
        }

        // --- PRINT LOGIC IMPLEMENTATION (MUST BE AFTER CORE FUNCTIONS) ---
        function generatePrint(assignIndex) {
            const sec = courseData[assignIndex];
            if(sec.type !== "assignment") return;

            document.getElementById('printGroup').innerText = sec.title;
            
            let score = 0;
            let tableBody = "";
            
            for(let i=0; i<sec.steps.length; i++) {
                const step = sec.steps[i];
                const globalIdx = getGlobalIndex(assignIndex, i);
                const state = appState.progress[globalIdx];
                
                // Extract plain text question for print
                let tempDiv = document.createElement("div");
                tempDiv.innerHTML = step.question;
                let plainQuestion = tempDiv.textContent || tempDiv.innerText || "";
                // Clean up double spaces from bilingual split
                plainQuestion = plainQuestion.replace(/\s\s+/g, ' ').trim();

                let studentAns = state.studentAnswer || "Not answered";
                let noteIcon = "❌";

                if(state.correct) {
                    score++;
                    noteIcon = "✅";
                }

                tableBody += `<tr>
                    <td>${i+1}</td>
                    <td>${plainQuestion}</td>
                    <td>${studentAns}</td>
                    <td>${step.answer}</td>
                    <td style="text-align:center">${noteIcon}</td>
                </tr>`;
            }

            document.getElementById('printScore').innerText = score;
            document.getElementById('printTableBody').innerHTML = tableBody;

            // Trigger Print
            window.print();
        }

        // Override showPath to inject Print Buttons for Assignments
        const originalShowPath = showPath;
        showPath = function() {
            originalShowPath();
            // After path is rendered, find assignment nodes and inject print buttons
            let stepCounter = 0;
            courseData.forEach((sec, secIndex) => {
                if(sec.type === "assignment") {
                    let isCompleted = true;
                    for(let i=0; i<sec.steps.length; i++) {
                        if(!appState.progress[stepCounter+i].completed) isCompleted = false;
                    }
                    
                    if(isCompleted) {
                        // Better query: find the title matching
                        const allTitles = document.querySelectorAll('.node-title');
                        allTitles.forEach(titleEl => {
                            if(titleEl.innerText === sec.title) {
                                const parentWrapper = titleEl.parentElement;
                                // Check if button already exists
                                if(!parentWrapper.querySelector('.print-btn')) {
                                    const printBtn = document.createElement('button');
                                    printBtn.className = 'nav-btn next print-btn';
                                    printBtn.style.marginTop = '10px';
                                    printBtn.style.fontSize = '0.8rem';
                                    printBtn.innerHTML = `<i class="fas fa-print"></i> Print Result`;
                                    printBtn.onclick = (e) => {
                                        e.stopPropagation();
                                        generatePrint(secIndex);
                                    };
                                    parentWrapper.appendChild(printBtn);
                                }
                            }
                        });
                    }
                }
                stepCounter += sec.steps.length;
            });
        };

        // KaTeX Render Trigger on Load
        document.addEventListener("DOMContentLoaded", function() {
            initApp();
            // Wait a bit for KaTeX scripts to load from defer
            setTimeout(() => {
                if(typeof renderMathInElement !== 'undefined') {
                    renderMathInElement(document.body, {
                        delimiters: [
                            {left: "\\(", right: "\\)", display: false},
                            {left: "\\[", right: "\\]", display: true}
                        ]
                    });
                }
            }, 500);
        });
    </script>
