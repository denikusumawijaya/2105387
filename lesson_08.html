<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keliling Petualangan - Math Tutoring</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ========== VARIABLES & RESET ========== */
:root{
  --bg:#F5F0E6;--fg:#2D2A24;--muted:#8B8579;--accent:#D4880F;--accent-light:#FFF8E7;
  --card:#FFFFFF;--border:#E5DFD3;--success:#2D8B4E;--success-light:#E8F5E9;
  --error:#C93B3B;--error-light:#FEF2F2;--path-bg:#1B3C2D;--path-active:#244D3A;
  --node-complete:#2D8B4E;--node-current:#D4880F;--node-locked:#3D5E4E;
  --sidebar-w:270px;--radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--fg);
  background-image:radial-gradient(circle,rgba(180,170,150,.18) 1px,transparent 1px);
  background-size:28px 28px;display:flex;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Fredoka',sans-serif}
.bi{font-size:15.5px;line-height:1.7;margin-bottom:3px}
.en{font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:14px;line-height:1.5}
.katex{font-size:1.05em!important}

/* ========== SIDEBAR PATH ========== */
#path-sidebar{width:var(--sidebar-w);background:var(--path-bg);position:fixed;left:0;top:0;bottom:0;
  overflow-y:auto;z-index:100;display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,.15)}
#path-sidebar::-webkit-scrollbar{width:4px}
#path-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.sidebar-header{padding:22px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-header h2{color:#FFF;font-size:15px;font-weight:600;letter-spacing:.3px}
.sidebar-header span{color:rgba(255,255,255,.5);font-size:11.5px}
.path-list{padding:16px 0;flex:1}
.path-node{display:flex;align-items:center;gap:12px;padding:9px 18px;cursor:pointer;
  position:relative;transition:background .2s}
.path-node:hover{background:var(--path-active)}
.path-node.active{background:var(--path-active)}
.path-node-circle{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;transition:all .3s;position:relative}
.path-node-circle.completed{background:var(--node-complete);color:#fff}
.path-node-circle.current{background:var(--node-current);color:#fff;
  box-shadow:0 0 0 5px rgba(212,136,15,.25);animation:nodePulse 2s infinite}
.path-node-circle.locked{background:var(--node-locked);color:rgba(255,255,255,.4)}
.path-node-info{display:flex;flex-direction:column;min-width:0}
.path-node-title{color:#E8E0D0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path-node-sub{color:rgba(255,255,255,.4);font-size:11px;margin-top:1px}
.path-connector{width:2px;height:18px;background:var(--node-locked);margin-left:38px;transition:background .3s}
.path-connector.done{background:var(--node-complete)}

@keyframes nodePulse{0%,100%{box-shadow:0 0 0 5px rgba(212,136,15,.25)}50%{box-shadow:0 0 0 10px rgba(212,136,15,.08)}}

/* ========== MAIN CONTENT ========== */
#content-area{margin-left:var(--sidebar-w);flex:1;padding:36px 42px 100px;max-width:820px}
.section-header{margin-bottom:32px}
.section-header .badge{display:inline-block;background:var(--accent);color:#fff;font-size:11.5px;
  font-weight:700;padding:4px 14px;border-radius:20px;margin-bottom:10px;letter-spacing:.3px}
.section-header h1{font-size:26px;font-weight:700;color:var(--fg);margin-bottom:4px}
.section-header .time{font-size:13px;color:var(--muted)}

/* ========== HOME ========== */
.home-card{background:var(--card);border-radius:var(--radius);padding:36px;
  box-shadow:0 2px 16px rgba(0,0,0,.06);border:1px solid var(--border);text-align:center;
  animation:fadeUp .5s ease}
.home-compass{margin:0 auto 24px;animation:spinSlow 20s linear infinite}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.home-title{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;color:var(--fg);margin-bottom:4px}
.home-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.home-topic{background:var(--accent-light);border:1px solid rgba(212,136,15,.2);border-radius:12px;
  padding:18px 22px;margin-bottom:28px;text-align:left}
.home-topic .bi{font-weight:700;color:var(--accent)}
.home-rules{text-align:left;margin-bottom:28px}
.home-rules li{padding:8px 0;font-size:14.5px;display:flex;align-items:flex-start;gap:10px}
.home-rules li .num{background:var(--path-bg);color:#fff;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:12px;
  font-family:'Fredoka',sans-serif;font-size:15px;font-weight:600;border:none;cursor:pointer;
  transition:all .2s;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(212,136,15,.3)}
.btn-primary:hover{background:#c07a0d;transform:translateY(-1px);box-shadow:0 5px 16px rgba(212,136,15,.35)}
.btn-outline{background:transparent;color:var(--error);border:2px solid var(--error)}
.btn-outline:hover{background:var(--error);color:#fff}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:8px}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#247a42}

/* ========== THEORY CARD ========== */
.theory-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.05);
  animation:fadeUp .45s ease both;border-left:4px solid var(--accent)}
.theory-card svg{display:block;margin:16px auto;max-width:100%}
.theory-card h3{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--fg)}
.theory-card .highlight{background:var(--accent-light);padding:2px 8px;border-radius:6px;
  font-weight:700;color:var(--accent)}

/* ========== EXERCISE CARD ========== */
.exercise-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:18px;transition:border-color .3s,box-shadow .3s;
  animation:fadeUp .45s ease both}
.exercise-card.correct{border-color:var(--success);box-shadow:0 0 0 3px rgba(45,139,78,.1)}
.exercise-card.wrong{border-color:var(--error);box-shadow:0 0 0 3px rgba(201,59,59,.1)}
.ex-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:50%;background:var(--path-bg);color:#fff;font-size:12px;font-weight:700;margin-right:10px;flex-shrink:0}
.ex-header{display:flex;align-items:flex-start;margin-bottom:14px}
.ex-question{flex:1}

/* ========== MCQ OPTIONS ========== */
.opt-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 16px;border:2px solid var(--border);border-radius:10px;background:var(--card);
  cursor:pointer;transition:all .18s;font-size:15px;margin-bottom:8px;font-family:'Nunito',sans-serif}
.opt-btn:hover:not(.disabled){border-color:var(--accent);background:var(--accent-light)}
.opt-btn.selected{border-color:var(--accent);background:var(--accent-light);font-weight:700}
.opt-btn.correct-opt{border-color:var(--success)!important;background:var(--success-light)!important}
.opt-btn.wrong-opt{border-color:var(--error)!important;background:var(--error-light)!important}
.opt-btn.disabled{cursor:default;pointer-events:none}
.opt-btn.disabled:not(.correct-opt):not(.wrong-opt){opacity:.55}
.opt-letter{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .18s}
.opt-btn.selected .opt-letter{border-color:var(--accent);background:var(--accent);color:#fff}
.opt-btn.correct-opt .opt-letter{border-color:var(--success);background:var(--success);color:#fff}
.opt-btn.wrong-opt .opt-letter{border-color:var(--error);background:var(--error);color:#fff}

/* ========== FILL INPUT ========== */
.fill-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fill-input{flex:1;min-width:160px;padding:12px 16px;border:2px solid var(--border);border-radius:10px;
  font-size:15px;font-family:'Nunito',sans-serif;outline:none;transition:border-color .2s}
.fill-input:focus{border-color:var(--accent)}
.fill-input.correct-input{border-color:var(--success)}
.fill-input.wrong-input{border-color:var(--error)}
.fill-input:disabled{background:#f9f7f3;cursor:default}

/* ========== EXPLANATION COLLAPSE ========== */
.exp-box{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .4s ease,margin .4s ease,opacity .3s;
  margin-top:0;padding:0 16px;border-radius:10px;opacity:0}
.exp-box.open{max-height:350px;margin-top:14px;padding:16px;opacity:1}
.exp-box.correct-exp{background:var(--success-light);border-left:4px solid var(--success)}
.exp-box.wrong-exp{background:var(--error-light);border-left:4px solid var(--error)}
.exp-box .exp-icon{margin-right:8px;font-size:16px}
.exp-box .exp-icon.ok{color:var(--success)}
.exp-box .exp-icon.no{color:var(--error)}
.ex-reset{margin-top:10px;display:inline-flex;align-items:center;gap:5px;padding:5px 12px;
  border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);
  font-size:12px;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s}
.ex-reset:hover{border-color:var(--error);color:var(--error);background:var(--error-light)}

/* ========== NAV BAR ========== */
.nav-bar{position:fixed;bottom:0;left:var(--sidebar-w);right:0;background:var(--card);
  border-top:1px solid var(--border);padding:12px 42px;display:flex;justify-content:space-between;
  align-items:center;z-index:90;box-shadow:0 -2px 16px rgba(0,0,0,.06)}
.nav-bar .btn{padding:10px 22px;font-size:14px}
.progress-mini{font-size:12.5px;color:var(--muted);text-align:center}
.progress-mini b{color:var(--accent)}

/* ========== COMING SOON ========== */
.coming-soon{text-align:center;padding:60px 20px;animation:fadeUp .5s ease}
.coming-soon i{font-size:48px;color:var(--border);margin-bottom:16px}
.coming-soon h2{font-size:20px;color:var(--muted);margin-bottom:8px}
.coming-soon p{color:var(--muted);font-size:14px}

/* ========== PRINT ========== */
@media print{
  body *{visibility:hidden}
  #print-zone,#print-zone *{visibility:visible}
  #print-zone{position:absolute;left:0;top:0;width:100%}
}

/* ========== ANIMATIONS ========== */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ========== PARTICLES ========== */
.particle{position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  animation:floatP var(--dur) var(--delay) infinite ease-in-out}
@keyframes floatP{0%,100%{transform:translate(0,0);opacity:0}15%{opacity:var(--op)}85%{opacity:var(--op)}50%{transform:translate(var(--dx),var(--dy))}}

/* ========== RESPONSIVE ========== */
@media(max-width:900px){
  :root{--sidebar-w:60px}
  .path-node-info,.sidebar-header span,.path-connector{display:none}
  .sidebar-header h2{font-size:11px;text-align:center}
  .path-node{justify-content:center;padding:10px 8px}
  #content-area{padding:24px 18px 100px}
  .nav-bar{left:var(--sidebar-w);padding:12px 18px}
}
</style>
</head>
<body>

  <aside id="path-sidebar"></aside>

  <div class="nav-bar" id="nav-bar"></div>

      {type:'fill',q:'Isilah awan bilangan: \\(1.250 + 250 = \\) ....',qEn:'Fill in the number cloud: \\(1.250 + 250 = \\) ....',ans:'1500',placeholder:'Ketik jawaban (tanpa titik)',exp:'\\(1.250 + 250 = 1.500\\). Pola loncat bertambah \\(250\\).',expEn:'\\(1.250 + 250 = 1.500\\). The jumping pattern increases by \\(250\\).'},

      {type:'mcq',q:'Manakah yang lebih besar, \\(3.802\\) atau \\(3.820\\)?',qEn:'Which is bigger, \\(3.802\\) or \\(3.820\\)?',opts:['3.820','3.802','Sama besar','Tidak bisa dibandingkan'],ans:'3.820',exp:'Bandingkan dari kiri: ribuan sama \\(3\\), ratusan sama \\(8\\), puluhan: \\(2 > 0\\). Jadi \\(3.820\\) lebih besar.',expEn:'Compare from the left: thousands equal \\(3\\), hundreds equal \\(8\\), tens: \\(2 > 0\\). So \\(3.820\\) is bigger.'},
      {type:'mcq',q:'Lanjutkan pola: \\(1.000\\), \\(1.250\\), \\(1.500\\), ....',qEn:'Continue the pattern: \\(1.000\\), \\(1.250\\), \\(1.500\\), ....',opts:['1.750','1.650','2.000','1.700'],ans:'1.750',exp:'Selisih tiap langkah \\(+250\\). Jadi \\(1.500 + 250 = 1.750\\).',expEn:'The difference each step is \\(+250\\). So \\(1.500 + 250 = 1.750\\).'}
    ]

      {title:'Soal Balik: Mencari Sisi dari Keliling', titleEn:'Reverse Problems: Finding Side from Perimeter',
       svg:`<svg viewBox="0 0 420 170" width="400" xmlns="http://www.w3.org/2000/svg">
         <defs>
           <filter id="sh16"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity=".1"/></filter>

         <!-- Kotak: Diketahui K -->
         <rect x="15" y="30" width="130" height="110" rx="10" fill="#FEF2F2" stroke="#C93B3B" stroke-width="1.5" filter="url(#sh16)"/>

         <path d="M155 85 L200 85" stroke="#D4880F" stroke-width="3" fill="none" marker-end="url(#arrRev)"/>
         <text x="177" y="75" text-anchor="middle" font-size="11" fill="#D4880F" font-weight="700" font-family="Fredoka">KEBALIK</text>

         <text x="253" y="80" text-anchor="middle" font-size="16" fill="#2D2A24" font-weight="700" font-family="Fredoka">20 ÷ 4</text>

         <text x="253" y="112" text-anchor="middle" font-size="20" fill="#2D8B4E" font-weight="700" font-family="Fredoka">= 5</text>

         <path d="M303 85 L330 85" stroke="#2D8B4E" stroke-width="3" fill="none" marker-end="url(#arrGr3)"/>
         <defs><marker id="arrGr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2D8B4E"/></marker></defs>

       lines:[
         {bi:'Kadang soal memberikan <span class="highlight">keliling</span> dan meminta kita mencari <span class="highlight">panjang sisi</span>. Ini disebut <span class="highlight">soal balik</span>.',en:'Sometimes a problem gives the <span class="highlight">perimeter</span> and asks us to find the <span class="highlight">side length</span>. This is called a <span class="highlight">reverse problem</span>.'},

/* ============================================================
   STATE MANAGEMENT
   ============================================================ */
const STORAGE_KEY = 'keliling_petualangan_state';
let state = {current:0, answers:{}, shuffled:{}, revealed:{}};

function loadState(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s)state=JSON.parse(s)}catch(e){}
}
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
}
function resetAll(){
  if(!confirm('Yakin ingin menghapus semua progres? / Are you sure you want to reset all progress?'))return;
  state={current:0,answers:{},shuffled:{},revealed:{}};
  saveState();renderSidebar();renderContent();renderNav();
}

/* ============================================================
   UTILITY
   ============================================================ */
function shuffleArray(arr){
  const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;
}
function normalize(v){return String(v).toLowerCase().trim().replace(/\./g,'').replace(/,/g,'').replace(/\s/g,'')}
function getShuffled(si,ei){
  const k=si+'-'+ei;
  if(!state.shuffled[k]){
    const ex=sectionsData[si].exercises[ei];
    if(ex&&ex.type==='mcq'&&ex.opts)state.shuffled[k]=shuffleArray(ex.opts);
    else state.shuffled[k]=null;
    saveState();
  }
  return state.shuffled[k];
}
function exId(si,ei){return si+'-'+ei}
function isAnswered(si,ei){return !!state.answers[exId(si,ei)]}
function isCorrect(si,ei){const a=state.answers[exId(si,ei)];return a&&a.correct}
function sectionScore(si){
  const exs=sectionsData[si].exercises;if(!exs||!exs.length)return 0;
  let c=0;exs.forEach((_,i)=>{if(isCorrect(si,i))c++});return c;
}
function sectionDone(si){const exs=sectionsData[si].exercises;return exs&&exs.length>0&&sectionScore(si)===exs.length}

/* ============================================================
   RENDER SIDEBAR
   ============================================================ */
function renderSidebar(){
  const sb=document.getElementById('path-sidebar');
  let h=`<div class="sidebar-header"><h2><i class="fa-solid fa-route" style="margin-right:6px;color:var(--accent)"></i> Petualangan</h2><span>Learning Path</span></div><div class="path-list">`;
  sectionsData.forEach((s,i)=>{
    const done=sectionDone(i);
    const cur=state.current===i;
    const cls=cur?'current':(done?'completed':'locked');
    const connectorCls=i>0?(sectionDone(i-1)?'done':''):'';
    if(i>0)h+=`<div class="path-connector ${connectorCls}"></div>`;
    h+=`<div class="path-node ${cur?'active':''}" onclick="goTo(${i})">
      <div class="path-node-circle ${cls}">
        ${done?'<i class="fa-solid fa-check"></i>':'<i class="fa-solid '+s.icon+'"></i>'}
      </div>
      <div class="path-node-info">
        <div class="path-node-title">${s.title}</div>
        ${s.sub?'<div class="path-node-sub">'+s.sub+'</div>':''}
      </div>
    </div>`;
  });
  h+=`</div>`;
  /* Tombol reset di bawah sidebar */
  h+=`<div style="padding:14px 18px;border-top:1px solid rgba(255,255,255,.08)">
    <button class="btn btn-outline btn-sm" style="width:100%;justify-content:center;font-size:12px" onclick="resetAll()">
      <i class="fa-solid fa-arrow-rotate-left"></i> Reset Semua Progres
    </button>
  </div>`;
  sb.innerHTML=h;
}

/* ============================================================
   RENDER NAV BAR
   ============================================================ */
function renderNav(){
  const nb=document.getElementById('nav-bar');
  const s=sectionsData[state.current];
  const exs=s.exercises||[];
  const total=exs.length;
  const done=total?sectionScore(state.current):0;
  let progHtml='';
  if(total)progHtml=`<div class="progress-mini"><b>${done}</b> / ${total} benar</div>`;
  nb.innerHTML=`
    <button class="btn btn-sm btn-outline" onclick="prevSection()" style="border-color:var(--path-bg);color:var(--path-bg)"><i class="fa-solid fa-chevron-left"></i> Sebelumnya</button>
    ${progHtml}
    <button class="btn btn-sm btn-primary" onclick="nextSection()">Selanjutnya <i class="fa-solid fa-chevron-right"></i></button>
  `;
}

/* ============================================================
   RENDER CONTENT
   ============================================================ */
function renderContent(){
  const area=document.getElementById('content-area');
  const s=sectionsData[state.current];
  if(s.type==='home'){area.innerHTML=renderHome();renderMath(area);return}
  if((!s.theories||!s.theories.length) && s.type!=='assignment'){
    area.innerHTML=`<div class="coming-soon"><i class="fa-solid fa-lock"></i><h2>Segera Hadir!</h2><p>Bagian ini akan tersedia di update berikutnya.</p></div>`;
    return;
  }
  let h=`<div class="section-header">
    <div class="badge">${s.titleFull}</div>
    <h1>${s.titleFull}</h1>
    ${s.sub?'<div class="time"><i class="fa-regular fa-clock"></i> '+s.sub+'</div>':''}
  </div>`;
  const exs=s.exercises||[];
  if(s.theories&&s.theories.length){
    s.theories.forEach((t,ti)=>{
      h+=renderTheoryCard(t,ti);
      const from=ti*3, to=Math.min(from+3,exs.length);
      for(let i=from;i<to;i++) h+=renderExerciseCard(state.current,i,exs[i]);
    });
  } else {
    /* Jika tidak ada teori (assignment), render semua exercise langsung */
    exs.forEach((ex,i)=>{h+=renderExerciseCard(state.current,i,ex)});
  }
  /* Tombol print untuk assignment */
  if(s.type==='assignment'){
    h+=`<div style="text-align:center;margin-top:28px">
      <button class="btn btn-success" onclick="printAssignment(${state.current})"><i class="fa-solid fa-print"></i> Cetak Hasil (Print Result)</button>
    </div>`;
  }
  /* Tombol link ke algonova untuk section akhir */
  if(s.type==='end'){
    h+=`<div style="text-align:center;margin-top:32px">
      <a href="https://learn.algonova.id/login" target="_blank" class="btn btn-primary" style="font-size:16px;padding:16px 36px;text-decoration:none;box-shadow:0 4px 20px rgba(212,136,15,.4)">
        <i class="fa-solid fa-rocket"></i> Lanjutkan di Algonova
      </a>
      <p style="margin-top:12px;font-size:13px;color:var(--muted)">Klik tombol di atas untuk membuka platform latihan</p>
      <p class="en" style="margin-top:2px">Click the button above to open the practice platform</p>
    </div>`;
  }
  area.innerHTML=h;
  renderMath(area);
}

/* ---- THEORY CARD ---- */
function renderTheoryCard(t,idx){
  let linesHtml='';
  t.lines.forEach(l=>{
    linesHtml+=`<p class="bi">${l.bi}</p><p class="en">${l.en}</p>`;
  });
  return `<div class="theory-card" style="animation-delay:${idx*0.08}s">
    <h3>${t.title}</h3>
    <p class="en" style="margin-bottom:12px;margin-top:-8px">${t.titleEn}</p>
    ${t.svg||''}
    ${linesHtml}
  </div>`;
}

/* ---- EXERCISE CARD ---- */
function renderExerciseCard(si,ei,ex){
  const id=exId(si,ei);
  const answered=isAnswered(si,ei);
  const correct=isCorrect(si,ei);
  const cardCls=answered?(correct?'correct':'wrong'):'';
  const num=ei+1;
  let bodyHtml='';

  if(ex.type==='mcq'){
    const shuffled=getShuffled(si,ei)||ex.opts;
    const letters='ABCDEFGH';
    bodyHtml=shuffled.map((opt,oi)=>{
      const isAns=normalize(opt)===normalize(ex.ans);
      let cls='';
      if(answered){
        cls='disabled';
        if(isAns)cls+=' correct-opt';
        else if(state.answers[id]&&normalize(state.answers[id].value)===normalize(opt)&&!correct)cls+=' wrong-opt';
      }
      return `<button class="opt-btn ${cls}" onclick="selectOpt('${id}',${si},${ei},'${opt.replace(/'/g,"\\'")}',this)" ${answered?'disabled':''}>`
        +`<span class="opt-letter">${letters[oi]}</span><span>${opt}</span></button>`;
    }).join('');
  } else {
    /* fill */
    const val=answered?state.answers[id].value:'';
    const inpCls=answered?(correct?'correct-input':'wrong-input'):'';
    bodyHtml=`<div class="fill-row">
      <input class="fill-input ${inpCls}" type="text" id="inp-${id}" value="${val}" placeholder="${ex.placeholder||'Ketik jawaban...'}" ${answered?'disabled':''} onkeydown="if(event.key==='Enter')submitFill('${id}',${si},${ei})">
      <button class="btn btn-sm btn-primary" onclick="submitFill('${id}',${si},${ei})" ${answered?'disabled':''}>Periksa</button>
    </div>`;
  }

  /* Explanation collapse */
  let expHtml='';
  if(answered&&state.revealed[id]){
    const expCls=correct?'correct-exp':'wrong-exp';
    const iconCls=correct?'ok':'no';
    const icon=correct?'fa-circle-check':'fa-circle-xmark';
    expHtml=`<div class="exp-box open ${expCls}">
      <p class="bi"><i class="fa-solid ${icon} exp-icon ${iconCls}"></i>${correct?'Benar! ':'Belum tepat. '}${ex.exp}</p>
      <p class="en">${correct?'Correct! ':'Not quite. '}${ex.expEn}</p>
    </div>`;
  }

  /* Tombol reset — hanya muncul jika sudah dijawab */
  let resetHtml='';
  if(answered){
    resetHtml=`<button class="ex-reset" onclick="resetExercise(${si},${ei})"><i class="fa-solid fa-rotate-left"></i> Coba Lagi</button>`;
  }

  return `<div class="exercise-card ${cardCls}" id="excard-${id}">
    <div class="ex-header">
      <span class="ex-num">${num}</span>
      <div class="ex-question">
        <p class="bi">${ex.q}</p>
        <p class="en">${ex.qEn}</p>
      </div>
    </div>
    ${bodyHtml}
    ${expHtml}
    ${resetHtml}
  </div>`;
}

/* ============================================================
   ANSWER HANDLING
   ============================================================ */
function selectOpt(id,si,ei,val,btn){
  if(state.answers[id])return;
  const ex=sectionsData[si].exercises[ei];
  const correct=normalize(val)===normalize(ex.ans);
  state.answers[id]={value:val,correct};
  state.revealed[id]=true;
  saveState();
  /* Re-render exercise card only */
  const card=document.getElementById('excard-'+id);
  if(card)card.outerHTML=renderExerciseCard(si,ei,ex);
  renderMath(document.getElementById('content-area'));
  renderSidebar();renderNav();
}
function submitFill(id,si,ei){
  if(state.answers[id])return;
  const inp=document.getElementById('inp-'+id);
  if(!inp)return;
  const val=inp.value.trim();
  if(!val)return;
  const ex=sectionsData[si].exercises[ei];
  const correct=normalize(val)===normalize(ex.ans);
  state.answers[id]={value:val,correct};
  state.revealed[id]=true;
  saveState();
  const cards=document.querySelectorAll('.exercise-card');
  if(cards[ei])cards[ei].outerHTML=renderExerciseCard(si,ei,ex);
  renderMath(document.getElementById('content-area'));
  renderSidebar();renderNav();
}
function resetExercise(si,ei){
  const id=exId(si,ei);
  delete state.answers[id];
  delete state.revealed[id];
  /* Hapus juga shuffled agar di-random ulang saat render */
  const sk=si+'-'+ei;
  delete state.shuffled[sk];
  saveState();
  const ex=sectionsData[si].exercises[ei];
  const cards=document.querySelectorAll('.exercise-card');
  if(cards[ei])cards[ei].outerHTML=renderExerciseCard(si,ei,ex);
  renderMath(document.getElementById('content-area'));
  renderSidebar();renderNav();
}


/* ============================================================
   NAVIGATION
   ============================================================ */
function goTo(i){
  if(i<0)i=sectionsData.length-1;
  if(i>=sectionsData.length)i=0;
  state.current=i;saveState();
  renderSidebar();renderContent();renderNav();
  document.getElementById('content-area').scrollTop=0;
  window.scrollTo(0,0);
}
function nextSection(){goTo(state.current+1)}
function prevSection(){goTo(state.current-1)}

/* ============================================================
   PRINT ASSIGNMENT
   ============================================================ */
function printAssignment(si){
  const s=sectionsData[si];
  const exs=s.exercises;
  const score=sectionScore(si);
  let rows='';
  exs.forEach((ex,i)=>{
    const a=state.answers[exId(si,i)];
    const stuAns=a?a.value:'-';
    const corAns=ex.ans;
    const ok=a&&a.correct;
    rows+=`<tr>
      <td style="text-align:center;border:1px solid #999;padding:4px 6px">${i+1}</td>
      <td style="border:1px solid #999;padding:4px 6px;font-size:9pt">${ex.q.replace(/\\\\\(/g,'(').replace(/\\\\\)/g,')')}</td>
      <td style="text-align:center;border:1px solid #999;padding:4px 6px">${stuAns}</td>
      <td style="text-align:center;border:1px solid #999;padding:4px 6px">${corAns}</td>
      <td style="text-align:center;border:1px solid #999;padding:4px 6px;font-size:14pt">${ok?'&#10003;':'&#10007;'}</td>
    </tr>`;
  });
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Assignment Result</title>
    <style>@page{size:A4;margin:15mm}body{font-family:Arial,sans-serif;font-size:10pt;color:#222}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th{background:#1B3C2D;color:#fff;padding:5px 6px;font-size:9pt;text-align:center}
    h1{font-size:14pt;margin-bottom:2px}h2{font-size:11pt;margin:0 0 10px;color:#555}
    .meta{display:flex;gap:24px;margin:8px 0 4px;font-size:10pt}
    .sig{margin-top:30px;text-align:right}</style></head>
    <body>
    <h1>MATH TUTORING by Deni</h1>
    <div class="meta"><div>Name: ..................................</div><div>Date: ..................................</div></div>
    <h2>Topic: Keliling Petualangan (Keliling Persegi dan Persegi Panjang)<br>Perimeter Adventure (Square and Rectangle Perimeter)</h2>
    <p><strong>Assignment Group:</strong> ${s.titleFull} &nbsp;&nbsp; <strong>Score:</strong> ${score} / ${exs.length}</p>
    <table>
      <thead><tr><th style="width:30px">No.</th><th>Question</th><th style="width:80px">Student Answer</th><th style="width:80px">Correct Answer</th><th style="width:35px">Note</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="sig">Checked by,<br><br><br><strong>Deni</strong></div>
    </body></html>`;
  const iframe=document.createElement('iframe');
  iframe.style.cssText='position:fixed;left:-9999px;top:0;width:0;height:0;border:none';
  document.body.appendChild(iframe);
  iframe.onload=function(){
    setTimeout(()=>{iframe.contentWindow.print();setTimeout(()=>{document.body.removeChild(iframe)},2000)},300);
  };
  iframe.srcdoc=html;
}

/* ============================================================
   KATEX RENDERING
   ============================================================ */
function renderMath(el){
  if(!el)el=document.getElementById('content-area');
  if(!el||typeof renderMathInElement==='undefined')return;
  renderMathInElement(el,{
    delimiters:[
      {left:'\\(',right:'\\)',display:false},
      {left:'\\[',right:'\\]',display:true}
    ],
    throwOnError:false
  });
}

/* ============================================================
   PARTICLES (dekorasi latar)
   ============================================================ */
function spawnParticles(){
  for(let i=0;i<18;i++){
    const p=document.createElement('div');p.className='particle';
    const size=3+Math.random()*4;
    p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}vw;top:${Math.random()*100}vh;
      background:rgba(212,136,15,${0.12+Math.random()*0.15});
      --dx:${-40+Math.random()*80}px;--dy:${-60+Math.random()*120}px;
      --dur:${12+Math.random()*14}s;--delay:${-Math.random()*12}s;--op:${0.3+Math.random()*0.4}`;
    document.body.appendChild(p);
  }
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  loadState();
  renderSidebar();
  renderContent();
  renderNav();
  spawnParticles();
}
document.addEventListener('DOMContentLoaded',init);
</script>
