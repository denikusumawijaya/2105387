<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tutoring - Keliling Segitiga</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --secondary: #1cb0f6;
            --danger: #ff4b4b;
            --warning: #ffc800;
            --bg-color: #f7f7f7;
            --text-color: #3c3c3c;
            --border-color: #e5e5e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .layout-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar (Left) */
        .sidebar {
            width: 280px;
            background: white;
            border-right: 2px solid var(--border-color);
            padding: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .nav-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .nav-header h2 {
            color: var(--secondary);
            font-size: 1.2rem;
        }

        .nav-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            flex: 1;
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #1899d6;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .nav-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1899d6;
        }

        .nav-btn.reset-btn {
            background: var(--danger);
            box-shadow: 0 4px 0 #cc3333;
        }
        .nav-btn.reset-btn:active {
            box-shadow: 0 0 0 #cc3333;
        }

        .path-list {
            list-style: none;
        }

        .path-node {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 12px;
            background: #fff;
            border: 2px solid var(--border-color);
            cursor: pointer;
            font-weight: bold;
            color: #777;
            transition: all 0.2s;
            position: relative;
        }

        .path-node:hover {
            background: #e5f7ff;
            border-color: #84d8ff;
        }

        .path-node.active {
            background: #e5f7ff;
            border-color: var(--secondary);
            color: #1899d6;
        }

        .path-node.completed {
            background: #e5ffe5;
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        .node-icon {
            width: 32px;
            height: 32px;
            background: #eee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .path-node.active .node-icon { background: var(--secondary); color: white; }
        .path-node.completed .node-icon { background: var(--primary); color: white; }
        .path-node.assignment .node-icon { background: var(--warning); color: white; }

        /* Main Content (Right) */
        .main-content {
            flex: 1;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .lesson-screen {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .translation {
            font-size: 0.85em;
            color: #777;
            font-style: italic;
            margin-top: 5px;
            display: block;
        }

        /* Theory & Exercise Styles */
        .theory-box, .exercise-box {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .theory-box {
            background: #e5f7ff;
            border-color: var(--secondary);
        }

        .exercise-box {
            background: #fff;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--secondary);
        }

        .option-btn.selected {
            border-color: var(--secondary);
            background: #e5f7ff;
        }

        .option-btn.correct {
            border-color: var(--primary);
            background: #e5ffe5;
            color: var(--primary-dark);
        }

        .option-btn.incorrect {
            border-color: var(--danger);
            background: #ffe5e5;
            color: var(--danger);
        }

        .check-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            flex: 1;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark);
            margin-top: 10px;
        }

        .check-btn:disabled {
            background: #e5e5e5;
            color: #afafaf;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .reset-btn-ex {
            background: #e5e5e5;
            color: #777;
            border: none;
            padding: 15px;
            width: 120px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #afafaf;
            transition: transform 0.1s, box-shadow 0.1s;
            flex-shrink: 0;
        }

        .reset-btn-ex:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #afafaf;
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            display: none;
        }

        .feedback.correct {
            background: #e5ffe5;
            color: var(--primary-dark);
            display: block;
        }

        .feedback.incorrect {
            background: #ffe5e5;
            color: var(--danger);
            display: block;
        }

        .collapse-btn {
            background: #f0f0f0;
            border: none;
            padding: 10px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .collapse-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #f9f9f9;
            padding: 0 15px;
            border-radius: 8px;
        }

        .collapse-content.open {
            max-height: 500px;
            padding: 15px;
        }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                display: block !important;
                position: absolute; 
                left: 0; top: 0;
                width: 210mm; 
                min-height: 297mm; 
                padding: 20mm; 
                margin: 0;
                font-size: 12pt;
            }
            .no-print { display: none !important; }
            table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            th, td { border: 1px solid #000; padding: 8px; text-align: left; }
            .print-header { text-align: center; margin-bottom: 20px; }
        }

        #print-area { display: none; }
        .svg-illustration { display: block; margin: 20px auto; max-width: 200px; }
        
        /* Home specific */
        .home-content { text-align: center; }
        .home-content ol { text-align: left; margin: 20px auto; width: fit-content; }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- Sidebar -->
    <aside class="sidebar no-print">
        <div class="nav-header">
            <h2>MATH TUTORING</h2>
            <p style="font-size:0.8rem; color:#777;">by Deni</p>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" onclick="prevStep()">Previous</button>
            <button class="nav-btn reset-btn" onclick="resetAll()">Reset</button>
            <button class="nav-btn" onclick="nextStep()">Next</button>
        </div>
        <ul class="path-list" id="path-list"></ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div id="content-area"></div>
    </main>
</div>

<div id="print-area"></div>

<script>
    let currentStepIndex = 0;
    let userProgress = {};
	let exerciseDB = {};

    const lessonStructure = [
        { id: 'home', type: 'home', label: 'Home' },
        { id: 'section-1', type: 'section', label: '1. Spiral Review' },
        { id: 'section-2', type: 'section', label: '2. Introduction' },
        { id: 'section-3', type: 'section', label: '3. Prior Knowledge' },
        { id: 'section-4', type: 'section', label: '4. Problem Intro' },
        { id: 'section-5', type: 'section', label: '5. Guided Practice' },
        { id: 'section-6', type: 'section', label: '6. Independent' },
        { id: 'assignment-1', type: 'assignment', label: 'Assignment 1' },
        { id: 'assignment-2', type: 'assignment', label: 'Assignment 2' },
        { id: 'assignment-3', type: 'assignment', label: 'Assignment 3' },
        { id: 'assignment-4', type: 'assignment', label: 'Assignment 4' },
        { id: 'assignment-5', type: 'assignment', label: 'Assignment 5' },
        { id: 'consolidation', type: 'consolidation', label: 'Consolidation' }
    ];

    const lessonData = {}; // Akan diisi di Part 2

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderMath(elementId) {
        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(document.getElementById(elementId), {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }
    }

    function init() {
        renderPath();
        showScreen('home');
    }

    function renderPath() {
        const list = document.getElementById('path-list');
        list.innerHTML = '';
        lessonStructure.forEach((step, index) => {
            const li = document.createElement('li');
            li.className = 'path-node';
            if (step.type === 'assignment') li.classList.add('assignment');
            if (userProgress[step.id]) li.classList.add('completed');
            if (index === currentStepIndex) li.classList.add('active');
            
            let icon = index;
            if (step.type === 'home') icon = '🏠';
            if (step.type === 'assignment') icon = '📝';
            if (step.type === 'consolidation') icon = '🏁';
            
            li.innerHTML = `<div class="node-icon">${icon}</div> ${step.label}`;
            li.onclick = () => showScreen(step.id);
            list.appendChild(li);
        });
    }

    function showScreen(screenId) {
        currentStepIndex = lessonStructure.findIndex(s => s.id === screenId);
        renderPath();
        const container = document.getElementById('content-area');
        container.innerHTML = '';
        
        if (screenId === 'home') {
            container.innerHTML = getHomeHTML();
        } else {
            renderContent(screenId, container);
        }
        window.scrollTo(0, 0);
    }

    function nextStep() {
        if (currentStepIndex < lessonStructure.length - 1) showScreen(lessonStructure[currentStepIndex + 1].id);
    }
    function prevStep() {
        if (currentStepIndex > 0) showScreen(lessonStructure[currentStepIndex - 1].id);
    }
    function resetAll() {
        if(confirm("Reset semua progres?")) {
            userProgress = {};
            init();
        }
    }
    function markComplete(stepId) {
        userProgress[stepId] = true;
        renderPath();
    }

    function getHomeHTML() {
        return `
            <div class="lesson-screen home-content">
                <h1 style="color: var(--secondary); margin-bottom: 5px;">MATH TUTORING by Deni</h1>
                <p class="translation">Math Tutoring by Deni</p>
                <h2 style="margin-top: 20px;">Topic: Tali Pengukur Keliling Segitiga</h2>
                <p class="translation">Topic: Triangle Perimeter String Measure</p>
                <hr style="margin: 20px auto; width: 50%;">
                <div style="background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 0 rgba(0,0,0,0.05); text-align: left; display: inline-block;">
                    <h3>Aturan Kelas:</h3>
                    <p class="translation">Class Rules:</p>
                    <ol style="margin-left: 20px; margin-top: 10px; line-height: 1.8;">
                        <li>Berbicara secara bergantian.<br><span class="translation">Take turns speaking.</span></li>
                        <li>Meminta izin jika ingin meninggalkan kelas.<br><span class="translation">Ask permission if you want to leave the class.</span></li>
                        <li>Menyalakan kamera dan microphone jika diperlukan.<br><span class="translation">Turn on camera and microphone if needed.</span></li>
                    </ol>
                </div>
                <p style="margin-top: 20px; color: #777;">Gunakan menu di sebelah kiri untuk navigasi.</p>
                <p class="translation">Use the menu on the left to navigate.</p>
            </div>
        `;
    }

    function renderContent(screenId, container) {
        const data = lessonData[screenId];
        if(!data) return;
        
        let html = `<div class="lesson-screen" id="${screenId}-screen">`;
        
        if (data.type === 'section') {
            html += `<h2>${data.title}</h2><p class="translation">${data.title_en}</p><hr style="margin:15px 0;">`;
            data.blocks.forEach((block, index) => {
                if (block.type === 'theory') {
                    html += `
                        <div class="theory-box">
                            ${block.svg ? block.svg : ''}
                            <h3>${block.title}</h3><p class="translation">${block.title_en}</p>
                            <p>${block.content}</p>
                            <p class="translation">${block.content_en}</p>
                        </div>
                    `;
                } else { // Exercise
                    html += renderExercise(block, `${screenId}-q-${index}`);
                }
            });
            html += `<button class="check-btn" onclick="markComplete('${screenId}'); alert('Bagian selesai! Silakan lanjut ke materi berikutnya.');">Selesai & Lanjut</button>`;
        } else if (data.type === 'assignment') {
            html += `<h2>${data.title}</h2><p class="translation">${data.title_en}</p><hr style="margin:15px 0;">`;
            html += `<p>Kerjakan 10 soal berikut. Jika sudah selesai, cetak hasilnya.</p><p class="translation">Complete the 10 questions. Print results when done.</p>`;
            data.questions.forEach((ex, index) => {
                html += renderExercise(ex, `${screenId}-q-${index}`);
            });
            html += `<button class="check-btn" style="background: var(--secondary); box-shadow: 0 4px 0 #1899d6;" onclick="printResult('${screenId}', '${data.title}')">Print Result (A4)</button>`;
        } else if (data.type === 'consolidation') {
            html += `<h2>${data.title}</h2><p class="translation">${data.title_en}</p><hr style="margin:15px 0;">`;
            html += `<div class="theory-box"><p>${data.content}</p><p class="translation">${data.content_en}</p></div>`;
            html += `<a href="https://learn.algonova.id/login" target="_blank" class="check-btn" style="display: block; text-align: center; text-decoration: none; background: var(--warning); box-shadow: 0 4px 0 #e6b800;">Login ke learn.algonova.id</a>`;
        }
        
        html += `</div>`;
        container.innerHTML = html;
        renderMath(`${screenId}-screen`);
    }

    function renderExercise(ex, qId) {
        // Simpan data exercise ke database sementara
        exerciseDB[qId] = ex;
        
        let optionsHtml = '';
        if (ex.ex_type === 'mcq' || ex.ex_type === 'checkbox') {
            const options = shuffleArray([...ex.options]);
            optionsHtml = options.map(opt => `
                <button class="option-btn" onclick="selectOption(this, '${qId}', '${ex.ex_type}', '${opt.replace(/'/g, "\\'")}')" data-value="${opt}">${opt}</button>
            `).join('');
        }

        return `
            <div class="exercise-box">
                <p><strong>Soal:</strong> ${ex.question}</p>
                <p class="translation">${ex.question_en}</p>
                <div id="${qId}-options" style="margin-top: 15px;">
                    ${optionsHtml}
                    ${ex.ex_type === 'input' ? `<input type="text" class="option-btn" placeholder="Ketik jawaban..." onkeyup="document.getElementById('${qId}-answer').value = this.value"><input type="hidden" id="${qId}-answer">` : ''}
                </div>
                <div class="btn-group">
                    <button class="check-btn" id="${qId}-check" onclick="checkAnswer('${qId}')">Periksa Jawaban</button>
                    <button class="reset-btn-ex" onclick="resetExercise('${qId}')">Reset</button>
                </div>
                <div id="${qId}-feedback" class="feedback"></div>
                <button class="collapse-btn" onclick="toggleCollapse('${qId}-collapse')">Lihat Penjelasan</button>
                <div id="${qId}-collapse" class="collapse-content">
                    <p>${ex.explanation}</p>
                    <p class="translation">${ex.explanation_en}</p>
                </div>
            </div>
        `;
    }

    function selectOption(btn, qId, type, value) {
        if (type === 'mcq') {
            btn.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            let hidden = document.getElementById(`${qId}-answer`);
            if (!hidden) {
                hidden = document.createElement('input');
                hidden.type = 'hidden';
                hidden.id = `${qId}-answer`;
                btn.parentElement.appendChild(hidden);
            }
            hidden.value = value;
        } else if (type === 'checkbox') {
            btn.classList.toggle('selected');
            let hidden = document.getElementById(`${qId}-answer`);
            if (!hidden) {
                hidden = document.createElement('input');
                hidden.type = 'hidden';
                hidden.id = `${qId}-answer`;
                btn.parentElement.appendChild(hidden);
                hidden.value = JSON.stringify([]);
            }
            let arr = JSON.parse(hidden.value);
            if (arr.includes(value)) {
                arr = arr.filter(v => v !== value);
            } else {
                arr.push(value);
            }
            hidden.value = JSON.stringify(arr);
        }
    }

    function checkAnswer(qId) {
        // Ambil data exercise dari database berdasarkan ID
        const ex = exerciseDB[qId];
        const userAnswer = document.getElementById(`${qId}-answer`)?.value || '';
        const feedback = document.getElementById(`${qId}-feedback`);
        const checkBtn = document.getElementById(`${qId}-check`);
        let isCorrect = false;

        if (ex.ex_type === 'mcq') {
            isCorrect = userAnswer === ex.answer;
        } else if (ex.ex_type === 'input') {
            isCorrect = userAnswer.toLowerCase().trim() === ex.answer.toLowerCase().trim();
        } else if (ex.ex_type === 'checkbox') {
            const userArr = userAnswer ? JSON.parse(userAnswer) : [];
            isCorrect = userArr.length === ex.answer.length && userArr.every(v => ex.answer.includes(v));
        }

        if (isCorrect) {
            feedback.className = 'feedback correct';
            feedback.innerHTML = `<strong>Benar!</strong> ${ex.explanation}`;
            checkBtn.style.display = 'none';
            document.querySelectorAll(`#${qId}-options .option-btn`).forEach(b => b.disabled = true);
        } else {
            feedback.className = 'feedback incorrect';
            feedback.innerHTML = `<strong>Kurang tepat.</strong> Coba lagi atau lihat penjelasan.`;
        }
        
        // Paksa KaTeX untuk merender ulang rumus matematika di dalam feedback
        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(feedback, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }
    }
	
    function resetExercise(qId) {
        // Reset opsi yang dipilih
        const optionsContainer = document.getElementById(`${qId}-options`);
        if(optionsContainer) {
            optionsContainer.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected', 'correct', 'incorrect');
                btn.disabled = false;
                if(btn.tagName === 'INPUT') {
                    btn.value = ''; // Kosongkan input teks
                }
            });
        }
        
        // Reset hidden input value
        const hiddenInput = document.getElementById(`${qId}-answer`);
        if(hiddenInput) {
            hiddenInput.value = '';
        }
        
        // Sembunyikan feedback
        const feedback = document.getElementById(`${qId}-feedback`);
        if(feedback) {
            feedback.className = 'feedback';
            feedback.innerHTML = '';
        }
        
        // Tampilkan kembali tombol "Periksa Jawaban"
        const checkBtn = document.getElementById(`${qId}-check`);
        if(checkBtn) {
            checkBtn.style.display = 'block';
        }
        
        // Tutup penjelasan (collapse)
        const collapse = document.getElementById(`${qId}-collapse`);
        if(collapse) {
            collapse.classList.remove('open');
        }
    }

    function toggleCollapse(id) {
        document.getElementById(id).classList.toggle('open');
    }

    function printResult(screenId, title) {
        const data = lessonData[screenId];
        let correctCount = 0;
        let rows = '';

        data.questions.forEach((ex, i) => {
            const qId = `${screenId}-q-${i}`;
            const userAnsRaw = document.getElementById(`${qId}-answer`)?.value || '-';
            let isCorrect = false;
            let displayAns = userAnsRaw;

            if (ex.ex_type === 'checkbox' && userAnsRaw !== '-') {
                displayAns = JSON.parse(userAnsRaw).join(', ');
                const arr = JSON.parse(userAnsRaw);
                isCorrect = arr.length === ex.answer.length && arr.every(v => ex.answer.includes(v));
            } else if (ex.ex_type === 'mcq') {
                isCorrect = userAnsRaw === ex.answer;
            } else if (ex.ex_type === 'input') {
                isCorrect = userAnsRaw.toLowerCase().trim() === ex.answer.toLowerCase().trim();
            }

            if (isCorrect) correctCount++;
            const correctDisplay = Array.isArray(ex.answer) ? ex.answer.join(', ') : ex.answer;

            rows += `<tr><td>${i+1}</td><td>${ex.question}</td><td>${displayAns}</td><td>${correctDisplay}</td><td style="text-align:center;">${isCorrect ? '✔' : '✖'}</td></tr>`;
        });

        document.getElementById('print-area').innerHTML = `
            <div class="print-header">
                <h2>MATH TUTORING by Deni</h2>
                <p><strong>Name:</strong> _______________</p>
                <p><strong>Date:</strong> _______________</p>
                <p><strong>Topic:</strong> Keliling Segitiga</p>
                <p><strong>Assignment Group:</strong> ${title}</p>
                <p><strong>Score:</strong> ${correctCount} / 10</p>
            </div>
            <table><thead><tr><th>No.</th><th>Question</th><th>Student Answer</th><th>Correct Answer</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table>
